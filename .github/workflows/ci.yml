name: CI

# Runs the same analysis/eval logic as scripts/smoke_test.sh, packaged as fast unit tests on
# synthetic inputs — no GPU, no VGGT-Omega checkpoint, and no large LFS data required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # lfs:false — tests use synthetic data, not the big artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: System libs for Open3D (headless)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libgomp1

      - name: Install analysis dependencies (no torch / no GPU)
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 opencv-python-headless==4.11.0.86 open3d==0.19.0 pytest

      - name: Run unit tests
        run: pytest -q tests/
